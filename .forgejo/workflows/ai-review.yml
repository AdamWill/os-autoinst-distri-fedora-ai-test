name: AI Code Review
on:
  pull_request_target:
    types: [labeled]

jobs:
  ai-review:
    runs-on: fedora
    if: forgejo.event.label.name == 'ai-review-please'
    uses: quality/workflows/.forgejo/workflows/ai-review.yml@main
    with:
      pr: ${{ forgejo.event.pull_request.number }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
